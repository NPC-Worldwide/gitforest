name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  GCP_WIF_PROVIDER: projects/210615044241/locations/global/workloadIdentityPools/github-pool/providers/github-gitforest
  GCP_DEPLOY_SA: gitforest-deploy@npcsh-449102.iam.gserviceaccount.com

permissions:
  id-token: write
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match workspace version $PKG_VERSION"
            exit 1
          fi
      - name: Check desktop version matches workspace version
        run: |
          PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          DESK_VERSION=$(python3 -c "import json; print(json.load(open('desktop/package.json'))['version'])")
          LOCK_VERSION=$(python3 -c "import json; print(json.load(open('desktop/package-lock.json'))['version'])")
          if [ "$DESK_VERSION" != "$PKG_VERSION" ] || [ "$LOCK_VERSION" != "$PKG_VERSION" ]; then
            echo "desktop version $DESK_VERSION (lock $LOCK_VERSION) does not match workspace version $PKG_VERSION"
            exit 1
          fi

  preflight:
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.gate.outputs.cloud }}
    steps:
      - id: gate
        run: |
          if [ -n "${{ secrets.GCP_WIF_PROVIDER }}" ] || [ "${{ github.event.repository.fork }}" != "true" ]; then
            echo "cloud=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloud=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: [gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: sh scripts/dist.sh "${GITHUB_REF_NAME#v}" linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: gitforest-linux-x64
          path: |
            gitforest-linux-x64.tar.gz
            gitforest-linux-x64.tar.gz.sha256

  build-macos:
    needs: [gates]
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require Apple signing secrets
        run: |
          missing=0
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::missing required secret $v (Apple code signing)"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
      - name: Import Apple signing certificate
        run: |
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
      - run: cargo build --workspace --release
      - name: Sign CLI binaries
        run: |
          for bin in gitforest git-remote-gitforest gtfo gitforest-mcp; do
            [ -f "target/release/$bin" ] || continue
            codesign --sign "Developer ID Application" --entitlements desktop/build/entitlements.cli.plist --timestamp --options runtime -f "target/release/$bin"
          done
          codesign -dv --verbose=4 target/release/gitforest 2>&1 | grep -q "Authority=Developer ID Application" || exit 1
      - run: sh scripts/dist.sh "${GITHUB_REF_NAME#v}" macos-arm64
      - name: Notarize CLI binaries
        run: |
          ditto -c -k --keepParent dist/gitforest gitforest-macos-arm64-notary.zip
          xcrun notarytool submit gitforest-macos-arm64-notary.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          rm gitforest-macos-arm64-notary.zip
      - name: Verify Gatekeeper acceptance
        run: spctl -a -vv --type exec target/release/gitforest
      - uses: actions/upload-artifact@v4
        with:
          name: gitforest-macos-arm64
          path: |
            gitforest-macos-arm64.tar.gz
            gitforest-macos-arm64.tar.gz.sha256

  build-windows:
    needs: [gates]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - shell: bash
        run: sh scripts/dist.sh "${GITHUB_REF_NAME#v}" windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: gitforest-windows-x64
          path: |
            gitforest-windows-x64.zip
            gitforest-windows-x64.zip.sha256

  build-deb:
    needs: [gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p debian/usr/bin debian/DEBIAN
          cp target/release/gitforest debian/usr/bin/
          cp target/release/git-remote-gitforest debian/usr/bin/
          cp target/release/gtfo debian/usr/bin/ 2>/dev/null || true
          cp target/release/gitforest-mcp debian/usr/bin/ 2>/dev/null || true
          cat > debian/DEBIAN/control <<EOF
          Package: gitforest
          Version: $VERSION
          Section: vcs
          Priority: optional
          Architecture: amd64
          Maintainer: gitforest team <team@gitforest.dev>
          Description: P2P git hosting over libp2p
           gitforest lets you host and clone git repositories peer-to-peer
           without a central server, using Kademlia DHT and mDNS discovery.
          EOF
          dpkg-deb --build debian gitforest_${VERSION}_amd64.deb
          sha256sum gitforest_${VERSION}_amd64.deb > gitforest_${VERSION}_amd64.deb.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gitforest-deb
          path: |
            gitforest_*.deb
            gitforest_*.deb.sha256

  build-desktop-linux:
    needs: [gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: cargo build -p gt-daemon -p gt-remote --release
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: gitforest-desktop-linux
          path: |
            desktop/release/*.deb
            desktop/release/*.AppImage

  build-desktop-macos:
    needs: [gates]
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Require Apple signing secrets
        run: |
          missing=0
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::missing required secret $v (Apple code signing)"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
      - name: Import Apple signing certificate
        run: |
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
      - run: cargo build -p gt-daemon -p gt-remote --release
      - name: Sign bundled CLI binaries
        run: |
          for bin in gitforest git-remote-gitforest gtfo; do
            [ -f "target/release/$bin" ] || continue
            codesign --sign "Developer ID Application" --entitlements desktop/build/entitlements.cli.plist --timestamp --options runtime -f "target/release/$bin"
          done
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: gitforest-desktop-macos
          path: desktop/release/*.dmg

  publish-gcs:
    needs: [preflight, build-linux, build-macos, build-windows, build-deb, build-desktop-linux, build-desktop-macos]
    if: needs.preflight.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER || env.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA || env.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: npcsh-449102

      - name: Publish binaries to GCS
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gsutil cp artifacts/gitforest-linux-x64/gitforest-linux-x64.tar.gz \
            gs://gitforest-executables/linux-x64/
          gsutil cp artifacts/gitforest-linux-x64/gitforest-linux-x64.tar.gz.sha256 \
            gs://gitforest-executables/linux-x64/
          gsutil cp artifacts/gitforest-macos-arm64/gitforest-macos-arm64.tar.gz \
            gs://gitforest-executables/macos-arm64/
          gsutil cp artifacts/gitforest-macos-arm64/gitforest-macos-arm64.tar.gz.sha256 \
            gs://gitforest-executables/macos-arm64/
          gsutil cp artifacts/gitforest-windows-x64/gitforest-windows-x64.zip \
            gs://gitforest-executables/windows-x64/
          gsutil cp artifacts/gitforest-windows-x64/gitforest-windows-x64.zip.sha256 \
            gs://gitforest-executables/windows-x64/
          gsutil cp artifacts/gitforest-deb/gitforest_${VERSION}_amd64.deb \
            gs://gitforest-executables/linux-x64/
          gsutil cp artifacts/gitforest-deb/gitforest_${VERSION}_amd64.deb.sha256 \
            gs://gitforest-executables/linux-x64/
          # Stable alias for the current release
          gsutil cp artifacts/gitforest-deb/gitforest_${VERSION}_amd64.deb \
            gs://gitforest-executables/linux-x64/gitforest_amd64.deb
          gsutil cp install.sh gs://gitforest-executables/install.sh
          gsutil cp install.ps1 gs://gitforest-executables/install.ps1
          for f in artifacts/gitforest-desktop-linux/*.deb; do
            gsutil cp "$f" gs://gitforest-executables/desktop/gitforest-desktop-linux-x64.deb
          done
          for f in artifacts/gitforest-desktop-linux/*.AppImage; do
            gsutil cp "$f" gs://gitforest-executables/desktop/gitforest-desktop-linux-x64.AppImage
          done
          for f in artifacts/gitforest-desktop-macos/*.dmg; do
            gsutil cp "$f" gs://gitforest-executables/desktop/gitforest-desktop-macos-arm64.dmg
          done

      - name: Publish manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > /tmp/manifest.json <<EOF
          {
            "version": "$VERSION",
            "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "downloads": {
              "linux-tar": "https://storage.googleapis.com/gitforest-executables/linux-x64/gitforest-linux-x64.tar.gz",
              "macos-tar": "https://storage.googleapis.com/gitforest-executables/macos-arm64/gitforest-macos-arm64.tar.gz",
              "linux-deb": "https://storage.googleapis.com/gitforest-executables/linux-x64/gitforest_${VERSION}_amd64.deb",
              "linux-deb-stable": "https://storage.googleapis.com/gitforest-executables/linux-x64/gitforest_amd64.deb",
              "linux-tar-sha256": "https://storage.googleapis.com/gitforest-executables/linux-x64/gitforest-linux-x64.tar.gz.sha256",
              "macos-tar-sha256": "https://storage.googleapis.com/gitforest-executables/macos-arm64/gitforest-macos-arm64.tar.gz.sha256",
              "linux-deb-sha256": "https://storage.googleapis.com/gitforest-executables/linux-x64/gitforest_${VERSION}_amd64.deb.sha256",
              "install": "https://storage.googleapis.com/gitforest-executables/install.sh",
              "desktop-linux-deb": "https://storage.googleapis.com/gitforest-executables/desktop/gitforest-desktop-linux-x64.deb",
              "desktop-linux-appimage": "https://storage.googleapis.com/gitforest-executables/desktop/gitforest-desktop-linux-x64.AppImage",
              "desktop-macos-dmg": "https://storage.googleapis.com/gitforest-executables/desktop/gitforest-desktop-macos-arm64.dmg",
              "windows-zip": "https://storage.googleapis.com/gitforest-executables/windows-x64/gitforest-windows-x64.zip",
              "windows-zip-sha256": "https://storage.googleapis.com/gitforest-executables/windows-x64/gitforest-windows-x64.zip.sha256",
              "install-ps1": "https://storage.googleapis.com/gitforest-executables/install.ps1"
            }
          }
          EOF
          gsutil -h "Cache-Control:no-cache,max-age=0" cp /tmp/manifest.json \
            gs://gitforest-executables/manifest.json

  release:
    needs: [gates, build-linux, build-macos, build-windows, build-deb, build-desktop-linux, build-desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f artifacts/gitforest-linux-x64/gitforest-linux-x64.tar.gz
          test -f artifacts/gitforest-macos-arm64/gitforest-macos-arm64.tar.gz
          test -f artifacts/gitforest-deb/gitforest_${VERSION}_amd64.deb
          test -f artifacts/gitforest-windows-x64/gitforest-windows-x64.zip
          test "$(tar -xzf artifacts/gitforest-linux-x64/gitforest-linux-x64.tar.gz -O gitforest/VERSION)" = "$VERSION"
          test "$(tar -xzf artifacts/gitforest-macos-arm64/gitforest-macos-arm64.tar.gz -O gitforest/VERSION)" = "$VERSION"
          test "$(unzip -p artifacts/gitforest-windows-x64/gitforest-windows-x64.zip gitforest/VERSION)" = "$VERSION"
          for sidecar in artifacts/gitforest-linux-x64/*.sha256 artifacts/gitforest-macos-arm64/*.sha256 artifacts/gitforest-windows-x64/*.sha256 artifacts/gitforest-deb/*.sha256; do
            (cd "$(dirname "$sidecar")" && sha256sum -c "$(basename "$sidecar")")
          done
          (cd artifacts && find . -type f -exec sha256sum {} + | sort > ../SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            SHA256SUMS.txt
            install.sh
            install.ps1
          generate_release_notes: true
